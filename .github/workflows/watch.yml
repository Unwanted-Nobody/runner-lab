name: watch

# Durable launcher for the private runner repository.
# This repository holds ONLY the launcher workflow and the runtime secrets; the actual
# engagement code lives in a private repository and is fetched at run time.
# Cadence: every 30 minutes (48 runs/day), one job, hard timeout 5 minutes.

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: '1'
      DEXWATCH_BUDGET_S: '240'
      DEXWATCH_OUT: ${{ github.workspace }}/artifacts
    steps:
      - name: fetch private runner
        uses: actions/checkout@v4
        with:
          repository: Unwanted-Nobody/cf-egress-lab
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: src
          persist-credentials: false

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/runner/requirements.txt

      - name: install
        run: python -m pip install --disable-pip-version-check -q -r src/runner/requirements.txt

      - name: run one pass
        env:
          FYSTRADE_SECRET: ${{ secrets.FYSTRADE_SECRET }}
          FYSTRADE_TOKEN: ${{ secrets.FYSTRADE_TOKEN }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          AIW3_API_KEY: ${{ secrets.AIW3_API_KEY }}
          AIW3_USER_ID: ${{ secrets.AIW3_USER_ID }}
          DEX_ENG_UID: ${{ secrets.DEX_ENG_UID }}
        run: python src/runner/dex_watch.py

      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
